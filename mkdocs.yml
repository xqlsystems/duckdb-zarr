site_name: duckdb-zarr
site_description: Query scientific Zarr arrays with DuckDB and SQL.
repo_url: https://github.com/xqlsystems/duckdb-zarr
use_directory_urls: true
strict: true
docs_dir: docs
site_dir: site
# Internal working notes stay in the repository, not the published site or search.
exclude_docs: |
  /filter-pushdown-learnings.md
  **/*handoff*.md
  **/HANDOFF*.md
  /internal/
theme:
  name: null
  custom_dir: docs/_theme
  static_templates: []
plugins:
  - search
hooks:
  - docs/_hooks.py
markdown_extensions:
  - fenced_code
  - tables
  - toc:
      permalink: true
nav:
  - Start here: README.md
  - Field guides:
      - Biology: biology/index.md
      - Climate: examples/climate.md
      - Geoscience: examples/geoscience.md
  - Formats:
      - AnnData: anndata.md
      - OME-Zarr: ome-zarr.md
  - Reference:
      - How it works: design.md
      - Scientific domains: domains.md
  - Development:
      - Documentation website: website.md
      - Versioning: versioning.md
      - Release guide: community-extension-release.md
