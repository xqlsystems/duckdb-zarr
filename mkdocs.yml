site_name: duckdb-zarr
site_description: Query scientific Zarr arrays with DuckDB and SQL.
repo_url: https://github.com/xqlsystems/duckdb-zarr
use_directory_urls: true
strict: true
docs_dir: docs
site_dir: site
theme:
  name: null
  custom_dir: docs/_theme
  static_templates: []
plugins:
  - search
hooks:
  - docs/_hooks.py
markdown_extensions:
  - fenced_code
  - tables
  - toc:
      permalink: true
nav:
  - Start here: README.md
  - Examples:
      - Overview: examples/index.md
  - Biology:
      - AnnData: anndata.md
      - OME-Zarr: ome-zarr.md
  - Scientific domains: domains.md
  - Reference:
      - SQL and design: design.md
  - Development:
      - Documentation website: website.md
      - Versioning: versioning.md
      - Release guide: community-extension-release.md
      - Filter pushdown notes: filter-pushdown-learnings.md
