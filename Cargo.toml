[package]
name = "zarr"
version = "0.1.3"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "zarr"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "=1.10505.0", features = ["loadable-extension"] }
# Base zarrs features: no blosc here — blosc_src bundles pthreads that conflict
# with Rtools42's libpthread on windows_amd64_mingw (x86_64-pc-windows-gnu).
# Blosc is re-added below for all other targets.
zarrs = { version = "0.23", default-features = false, features = [
    "ndarray",
    "filesystem",
    "gzip",
    "zstd",
    "crc32c",
    "sharding",
    "transpose",
] }
ndarray = "0.17"
serde_json = "1"
base64 = "0.22"

# zarrs_http -> reqwest::blocking, which does not exist on wasm32. On wasm,
# HTTP stores go through DuckDbStore (duckdb-wasm's own httpfs) instead.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
zarrs_http = "0.3.1"
# Already in the tree transitively via duckdb -> arrow -> arrow-arith, so taking
# it directly costs nothing new; feature unification pulls in std/alloc from
# that transitive edge regardless of default-features here. Used for calendar
# arithmetic in cftime.rs (NaiveDate::from_ymd_opt subsumes hand-rolled
# days_from_civil/days_in_month/is_leap_year, and validates day-of-month too).
chrono = { version = "0.4", default-features = false }

# wasm has no threads: zarrs' rayon usage must run on a pool that never spawns.
# See zarr_init_c_api_internal.
[target.'cfg(target_family = "wasm")'.dependencies]
rayon = "1.12"

# zarrs_http → reqwest → native-tls → openssl-sys. On Linux the DuckDB CI sets
# OPENSSL_DIR to a vcpkg path that doesn't exist. Vendored mode compiles OpenSSL
# from source and ignores OPENSSL_DIR entirely. macOS and Windows provide TLS via
# Security.framework / SChannel, so vendoring is unnecessary there.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# Enable blosc everywhere except x86_64-pc-windows-gnu (Rtools42/mingw).
# SKIP_TESTS=1 for that target so blosc is never exercised there in CI.
# On wasm c-blosc compiles against emscripten's pthread stubs; with nthreads=1
# (zarrs' default) it never calls pthread_create, so it works without threads.
[target.'cfg(not(all(target_os = "windows", target_env = "gnu")))'.dependencies]
zarrs = { version = "0.23", default-features = false, features = ["blosc"] }
