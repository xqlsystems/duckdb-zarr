<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>duckdb-zarr map demo</title>
    <style>
      html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; }
      #app { display: grid; grid-template-columns: 380px 1fr; height: 100%; }
      aside { padding: 12px; overflow: auto; border-right: 1px solid #ccc; display: flex; flex-direction: column; gap: 8px; }
      textarea { width: 100%; height: 220px; font: 12px ui-monospace, monospace; box-sizing: border-box; }
      input { width: 100%; box-sizing: border-box; }
      #map { position: relative; background: #0b1020; }
      #status { white-space: pre-wrap; font: 12px ui-monospace, monospace; color: #555; }
      #status.error { color: #b00020; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside>
        <strong>duckdb-zarr in the browser</strong>
        <label>Zarr store URL <input id="url" /></label>
        <label>SQL (must return <code>lon</code>, <code>lat</code>, <code>value</code>)
          <textarea id="sql"></textarea>
        </label>
        <button id="run">Run</button>
        <div id="status">Loading DuckDB…</div>
      </aside>
      <div id="map"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
