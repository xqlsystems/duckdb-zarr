name: Rust quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}
  cancel-in-progress: true

jobs:
  vgi-worker:
    name: VGI worker (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/vgi-zarr
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/vgi-zarr
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # This crate is deliberately outside the extension's workspace. Exercise
      # its actual stdio worker with local fixtures, without DuckDB or live URLs.
      - run: cargo test --locked

  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - uses: j178/prek-action@v2

  release-metadata:
    name: Release metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fails the PR if the DuckDB version pins (Makefile
      # TARGET_DUCKDB_VERSION, Cargo.toml crate pin) disagree, if the
      # distribution pipeline carries a stale duckdb_version literal instead
      # of resolving it from the Makefile, or if the community descriptor
      # fields drift. With USE_UNSTABLE_C_API=1 an inconsistent pin ships a
      # binary that no DuckDB can load, so this guards every change — not
      # just releases.
      - name: Check release-critical metadata
        run: python3 scripts/check_release_ready.py
