#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # The DuckDB version pin lives in exactly one place: TARGET_DUCKDB_VERSION
  # in the Makefile. The distribution job below resolves it from there at run
  # time instead of carrying a `duckdb_version:` literal here — a literal in a
  # workflow file would be a second pin site that automated bump PRs must
  # rewrite, and GitHub refuses to let the Actions GITHUB_TOKEN push changes
  # to files under .github/workflows/ under any `permissions:` grant.
  resolve-duckdb-version:
    name: Resolve pinned DuckDB version
    runs-on: ubuntu-latest
    outputs:
      duckdb_version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read TARGET_DUCKDB_VERSION from Makefile
        id: pin
        run: |
          ver=$(grep -oE '^TARGET_DUCKDB_VERSION=v[0-9]+\.[0-9]+\.[0-9]+$' Makefile | head -1 | cut -d= -f2)
          if [ -z "$ver" ]; then
            echo "::error::could not parse TARGET_DUCKDB_VERSION from Makefile"; exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Pinned DuckDB version: $ver"

  duckdb-stable-build:
    name: Build extension binaries
    needs: resolve-duckdb-version
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: ${{ needs.resolve-duckdb-version.outputs.duckdb_version }}
      ci_tools_version: v2.0-cyanoptera
      extension_name: zarr
      extra_toolchains: rust;python3
      exclude_archs: 'linux_amd64_musl'
      opt_in_archs: 'osx_amd64'
      reduced_ci_mode: 'disabled'

  duckdb-v1-compatibility:
    name: DuckDB 1.5.6 compatibility
    needs: [resolve-duckdb-version, duckdb-stable-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Download the DuckDB 2.0 build's Linux binary
        uses: actions/download-artifact@v4
        with:
          name: zarr-${{ needs.resolve-duckdb-version.outputs.duckdb_version }}-extension-linux_amd64
          path: build/compatibility
      - name: Load the same binary in DuckDB 1.5.6
        run: make test_duckdb_v1 COMPAT_EXTENSION=build/compatibility/zarr.duckdb_extension
