#
# Detects when the pinned DuckDB version has drifted from the latest stable
# pip `duckdb` release (latest patch of the active minor line — what the
# community-extensions repo builds against), and opens a PR bumping the
# pinned sites. The PR's normal build/test pipeline is the validation gate —
# a human reviews and merges.
#
# The sqllogictest test runner itself installs the pinned version
# (DUCKDB_TEST_VERSION in the Makefile), so a pin that drifts behind the
# latest stable release no longer breaks CI test loading — it silently ships
# an extension the community repo can't distribute. This workflow is what
# surfaces that drift.
#
# Why the pinned sites: the extension links the `duckdb` crate and the Makefile
# stamps the extension-metadata version via TARGET_DUCKDB_VERSION; the
# distribution workflow resolves its `duckdb_version` from the Makefile at run
# time, so it is not a pin site. With USE_UNSTABLE_C_API=1 the loader requires
# an EXACT version match, so every site must agree with the runner or
# `Test extension` fails to load the built extension.
#
# The bump must not touch files under .github/workflows/ (or any other file
# GITHUB_TOKEN cannot push): GitHub permanently refuses to let the Actions
# GITHUB_TOKEN push workflow-file changes, so such a PR can never be opened.
#
name: DuckDB Version Drift

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily — catch new patch releases within a day
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-and-bump:
    name: Check DuckDB version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read currently pinned version
        id: current
        run: |
          cur=$(grep -oE 'TARGET_DUCKDB_VERSION=v[0-9]+\.[0-9]+\.[0-9]+' Makefile | cut -d= -f2)
          if [ -z "$cur" ]; then
            echo "::error::could not parse TARGET_DUCKDB_VERSION from Makefile"; exit 1
          fi
          echo "version=$cur" >> "$GITHUB_OUTPUT"
          echo "Currently pinned: $cur"

      - name: Resolve latest stable DuckDB version
        id: latest
        run: |
          # What the community-extensions repo builds against: the latest
          # stable pip `duckdb`, within the current minor line — a major/minor
          # jump is a deliberate, manual upgrade (it usually needs code
          # changes), not an automated bump.
          minor=$(echo "${{ steps.current.outputs.version }}" | sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/')
          latest=$(curl -fsSL https://pypi.org/pypi/duckdb/json \
            | jq -r --arg m "$minor." '
                .releases | keys[]
                | select(startswith($m))
                | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::no stable pip duckdb release found in the $minor line"; exit 1
          fi
          echo "version=v$latest" >> "$GITHUB_OUTPUT"
          echo "Latest runner version: v$latest"

      - name: Report drift
        id: drift
        run: |
          if [ "${{ steps.current.outputs.version }}" = "${{ steps.latest.outputs.version }}" ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DuckDB pin ${{ steps.current.outputs.version }} is up to date."
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Drift: pinned ${{ steps.current.outputs.version }} -> runner ${{ steps.latest.outputs.version }}"
          fi

      - name: Compute crate version
        id: crate
        if: steps.drift.outputs.drifted == 'true'
        run: |
          # duckdb-rs encodes the DuckDB version: v1.5.4 -> 1.10504.0 (1.1<minor:02><patch:02>.0)
          ver="${{ steps.latest.outputs.version }}"; ver="${ver#v}"
          IFS=. read -r _maj min pat <<< "$ver"
          crate=$(printf '1.1%02d%02d.0' "$min" "$pat")
          echo "version=$crate" >> "$GITHUB_OUTPUT"
          # crates.io requires a User-Agent; verify the matching crate is published.
          if curl -fsSL -H 'User-Agent: duckdb-zarr-drift-bot' \
               "https://crates.io/api/v1/crates/duckdb/$crate" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Target crate: duckdb $crate"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::duckdb crate $crate is not yet published on crates.io; skipping bump this run."
          fi

      - name: Apply bump
        id: bump
        if: steps.drift.outputs.drifted == 'true' && steps.crate.outputs.exists == 'true'
        run: |
          new="${{ steps.latest.outputs.version }}"
          crate="${{ steps.crate.outputs.version }}"
          # 1. Makefile target (stamps extension metadata)
          sed -i -E "s/^TARGET_DUCKDB_VERSION=.*/TARGET_DUCKDB_VERSION=$new/" Makefile
          # 2. Cargo.toml exact crate pin (the only `version = "=...` line) + lockfile.
          #    Never edit files under .github/workflows/ here — GITHUB_TOKEN
          #    cannot push workflow-file changes, so the PR push would fail
          #    (the distribution pipeline resolves duckdb_version from the Makefile).
          sed -i -E "s/(version = \")=[0-9]+\.[0-9]+\.[0-9]+/\1=$crate/" Cargo.toml
          cargo update -p duckdb --precise "$crate"

      - name: Open bump PR
        if: steps.drift.outputs.drifted == 'true' && steps.crate.outputs.exists == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/bump-duckdb-${{ steps.latest.outputs.version }}
          title: "chore: bump DuckDB to ${{ steps.latest.outputs.version }}"
          commit-message: "chore: bump DuckDB to ${{ steps.latest.outputs.version }}"
          labels: dependencies
          body: |
            Automated DuckDB version bump.

            The latest stable pip `duckdb` release (what
            duckdb/community-extensions builds against) moved to
            **${{ steps.latest.outputs.version }}**. This updates the pinned
            sites that must match it (exact match is required because
            `USE_UNSTABLE_C_API=1`):

            - `Makefile` → `TARGET_DUCKDB_VERSION=${{ steps.latest.outputs.version }}`
            - `Cargo.toml` → `duckdb = "=${{ steps.crate.outputs.version }}"` (+ `Cargo.lock`)

            The distribution pipeline reads its `duckdb_version` from the
            Makefile at build time, so no workflow-file change is needed.

            ⚠️ A crate API change may require manual source edits (e.g. the
            1.10504.0 bump made `FlatVector::as_mut_ptr` `unsafe`). **Rely on this
            PR's build/test pipeline** before merging.

            Generated by `.github/workflows/duckdb-version-drift.yml`.

      # The bump PR above stays within the current minor line. A brand-new minor
      # or major DuckDB line (e.g. 1.5.x -> 1.6.0) usually needs source changes
      # and the CI-tools codename branch, so it is a deliberate manual migration
      # — but we should not find out by noticing the extension is unavailable.
      # Surface it as a tracking issue instead. These steps must not depend on
      # the bump steps succeeding: a failed bump push (e.g. while a crate is
      # missing) must not silence the migration signal.
      - name: Detect newer DuckDB minor/major line
        id: newline
        if: ${{ !cancelled() }}
        run: |
          cur_my=$(echo "${{ steps.current.outputs.version }}" | sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/')
          newest=$(curl -fsSL https://pypi.org/pypi/duckdb/json \
            | jq -r '.releases | keys[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            | sort -V | tail -1)
          newest_my=$(echo "$newest" | sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/')
          echo "newest=v$newest" >> "$GITHUB_OUTPUT"
          echo "newest_minor=$newest_my" >> "$GITHUB_OUTPUT"
          # "newer" only when the newest stable line differs from ours and sorts after it.
          top=$(printf '%s\n%s\n' "$cur_my" "$newest_my" | sort -V | tail -1)
          if [ "$cur_my" != "$newest_my" ] && [ "$top" = "$newest_my" ]; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Newer DuckDB line available: pinned $cur_my, newest v$newest"
          else
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No newer DuckDB minor/major line (pinned $cur_my, newest v$newest)."
          fi

      - name: Open minor/major migration tracking issue
        if: ${{ !cancelled() && steps.newline.outputs.newer == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create duckdb-major-bump \
            --color BFD4F2 \
            --description "A new DuckDB minor/major line needs a manual extension migration" \
            2>/dev/null || true
          # Idempotent: keep at most one open tracker.
          open_count=$(gh issue list --state open --label duckdb-major-bump --json number --jq 'length')
          if [ "$open_count" != "0" ]; then
            echo "::notice::A duckdb-major-bump tracking issue is already open; nothing to do."
            exit 0
          fi
          {
            printf 'DuckDB **%s** is out, opening the `%s` line. This extension pins `%s`.\n\n' \
              "${{ steps.newline.outputs.newest }}" "${{ steps.newline.outputs.newest_minor }}" "${{ steps.current.outputs.version }}"
            printf 'The `DuckDB Version Drift` bot only bumps **within** the current minor line, because a new minor/major usually needs source changes and a matching `duckdb-rs` crate. This one is a manual migration:\n\n'
            printf '1. Point the `extension-ci-tools` submodule + `ci_tools_version` at the new DuckDB codename branch.\n'
            printf '2. Bump the version pins to `%s` (Makefile `TARGET_DUCKDB_VERSION`, `Cargo.toml` duckdb pin) + `Cargo.lock`. The distribution pipeline reads its `duckdb_version` from the Makefile at build time.\n' "${{ steps.newline.outputs.newest }}"
            printf '3. `make lint && make test_release`; fix any API breaks.\n'
            printf '4. Stage the migrated commit as `ref_next` (see `docs/community-extension-release.md`) so the extension is available the moment `%s` ships.\n\n' "${{ steps.newline.outputs.newest_minor }}"
            printf 'Opened automatically by `.github/workflows/duckdb-version-drift.yml`.\n'
          } > issue_body.md
          gh issue create \
            --title "Migrate to DuckDB ${{ steps.newline.outputs.newest_minor }} line (${{ steps.newline.outputs.newest }})" \
            --label duckdb-major-bump \
            --body-file issue_body.md
