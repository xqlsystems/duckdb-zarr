[project]
name = "duckdb-zarr"
version = "0.1.3"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "numpy",
    "xarray",
    "zarr",
    "scipy",
    "h5netcdf",
    "h5py",
    "pooch",
    "virtualizarr>=2.5.1",
    "tifffile>=2026.3.3",
    "virtual-tiff>=0.5.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "prek>=0.4.5",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "network: reads a real public store over the internet (skipped when unreachable)",
]
