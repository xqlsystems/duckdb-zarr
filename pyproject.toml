[project]
name = "duckdb-zarr"
version = "0.1.3"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "numpy",
    "xarray",
    "zarr",
    "scipy",
    "h5netcdf",
    "h5py",
    "pooch",
    "anndata",
]

[dependency-groups]
dev = [
    "prek>=0.4.5",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "network: reads a real public store over the internet (skipped when unreachable)",
]
